name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck provisioning scripts
        run: shellcheck scripts/*.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile the touchpad bridge
        run: python -m py_compile trackpad/touchpad_bridge.py
